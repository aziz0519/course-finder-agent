[project]
name = "course-finder-agent"
version = "0.1.0"
description = "Student learning and course-planning assistant (MVP)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jsonschema>=4.23",
    "pymupdf==2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pdfplumber==0.11.10",
    "pwdlib[argon2]>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
]
e2e = [
    "playwright>=1.49",
]
infra = [
    "aws-cdk-lib>=2.180,<3",
    "constructs>=10,<11",
]
ui = [
    "gradio>=6.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "infra/tests"]
pythonpath = ["backend", "."]
addopts = "-q"
markers = [
    "corpus: needs the approved reading PDFs, which are not committed to git",
    "e2e: browser-level test that needs running API/UI containers",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts", "ui", "infra", "e2e"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend:scripts"
files = ["backend/app", "backend/tests", "scripts", "ui", "infra", "e2e"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["aws_cdk.*", "constructs.*"]
ignore_missing_imports = true
follow_imports = "skip"
